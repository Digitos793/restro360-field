<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ea580c">
  <title>Restro360 Field</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Restro360 Field</h1>
    <button id="syncPill" class="pill" hidden></button>
  </header>
  <nav id="nav" class="nav" hidden></nav>
  <main id="view" class="view"></main>

  <div id="toast" class="toast" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <button class="modal-x" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="busy" class="busy" hidden><div class="spinner"></div><p id="busyText">Please wait…</p></div>

  <script src="config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="panel.js"></script>
</body>
</html>
